name: Android app build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PRoot engine source
        run: git submodule update --init --depth 1 android/runtime-upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android native build tools
        run: sdkmanager "platforms;android-36" "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Sign release APK
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" sign --ks /tmp/release.jks --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --ks-key-alias "$SIGNING_KEY_ALIAS" --out android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release-signed.apk
          rm -f /tmp/release.jks
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-studio-release-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
